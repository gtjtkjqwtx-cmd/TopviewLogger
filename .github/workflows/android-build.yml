name: Build Android APK

on:
  push:
    branches: [ build-apk ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Commit APK to branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/TopviewLogger.apk
          git checkout --orphan apk-release
          git rm -rf .
          mv /tmp/TopviewLogger.apk ./TopviewLogger.apk
          git add TopviewLogger.apk
          git commit -m "Auto-generated APK"
          git push -f origin apk-release
